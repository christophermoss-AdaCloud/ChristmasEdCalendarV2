<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Educational Advent Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="snow-container" id="snow"></div>
    
    <header>
        <h1>🎄 Christmas Educational Advent Calendar 🎄</h1>
        <p class="subtitle">Discover something new each day leading up to Christmas!</p>
    </header>

    <main class="calendar-container">
        <div class="calendar-grid" id="calendar">
            <!-- Days will be generated by JavaScript -->
        </div>
    </main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Christmas Educational Calendar | Made with ❤️</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
